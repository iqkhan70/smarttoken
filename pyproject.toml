[project]
name = "smarttoken"
version = "0.1.0"
description = "Local repo indexer that emits token-budgeted packets for paid AI."
readme = "PLAN.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "pathspec>=0.12",
    "tiktoken>=0.7",
    "tree-sitter-language-pack>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
smarttoken = "smarttoken.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smarttoken"]

[tool.hatch.build.targets.wheel.force-include]
"tests/fixtures/sample_repo" = "smarttoken/data/sample_repo"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = ["fixtures", ".git", ".venv", "*.egg-info"]
